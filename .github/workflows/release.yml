name: Release Packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        run: npm run check
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}

      - name: Run tests
        run: npm test

      - name: Build packages
        run: npm run package

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v5
        with:
          name: harness-lens-packages
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  attach-vsix:
    name: Attach VSIX to GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          name: harness-lens-packages
          path: artifacts/

      - name: Attach VSIX
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish-npm:
    name: Publish npm package
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        run: npm run check
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}

      - name: Run tests
        run: npm test

      - name: Publish with npm trusted publishing
        run: npm publish --workspace @harness-lens/vscode --access public
