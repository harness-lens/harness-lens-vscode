name: Release Packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        run: npm run check
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}

      - name: Run tests
        run: npm test

      - name: Build packages
        run: npm run package

      - name: Generate package SBOMs
        run: npm run sbom

      - name: Attest package build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.tgz
            artifacts/*.vsix

      - name: Attest npm package SBOM
        uses: actions/attest@v4
        with:
          subject-path: artifacts/*.tgz
          sbom-path: artifacts/harness-lens-vscode.cdx.json

      - name: Attest extension SBOM
        uses: actions/attest@v4
        with:
          subject-path: artifacts/*.vsix
          sbom-path: artifacts/harness-lens-extension.cdx.json

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: harness-lens-packages
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  windows-language-server:
    name: Build Windows language server
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout immutable language-server source
        uses: actions/checkout@v7
        with:
          repository: harness-lens/language-server
          ref: eacaa3e9808169d1e7a78eece563acf1a23aab3e
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native server
        run: cargo build --locked --release --manifest-path rust/Cargo.toml

      - name: Assemble server archive
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path artifacts/server | Out-Null
          Copy-Item rust/target/release/harness-lens-lsp.exe artifacts/server/
          Copy-Item LICENSE artifacts/server/
          Compress-Archive -Path artifacts/server/* -DestinationPath artifacts/harness-lens-lsp-windows-x64.zip

      - name: Attest language-server build provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/harness-lens-lsp-windows-x64.zip

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: harness-lens-windows-server
          path: artifacts/harness-lens-lsp-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  assemble-release:
    name: Assemble release assets
    needs: [package, windows-language-server]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: harness-lens-packages
          path: artifacts/

      - name: Download Windows language server
        uses: actions/download-artifact@v8
        with:
          name: harness-lens-windows-server
          path: artifacts/

      - name: Add installer scripts and immutable checksums
        run: |
          cp scripts/install-harness-lens.ps1 artifacts/
          cp scripts/uninstall-harness-lens.ps1 artifacts/
          cd artifacts
          sha256sum *.tgz *.vsix *.zip *.ps1 *.cdx.json > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload complete release
        uses: actions/upload-artifact@v7
        with:
          name: harness-lens-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  attach-packages:
    name: Attach packages to GitHub release
    needs: assemble-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: harness-lens-release
          path: artifacts/

      - name: Attach packages, installers, checksums, and SBOMs
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  publish-open-vsx:
    name: Publish reviewed VSIX to Open VSX
    needs: assemble-release
    if: ${{ vars.OPEN_VSX_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: open-vsx
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download reviewed release artifacts
        uses: actions/download-artifact@v8
        with:
          name: harness-lens-release
          path: artifacts/

      - name: Verify downloaded release artifacts
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS

      - name: Publish to Open VSX
        run: npm run publish:open-vsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  publish-marketplace:
    name: Publish reviewed VSIX to Marketplace
    needs: [assemble-release, attach-packages]
    if: ${{ vars.VS_MARKETPLACE_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download reviewed release artifacts
        uses: actions/download-artifact@v8
        with:
          name: harness-lens-release
          path: artifacts/

      - name: Verify exact release artifacts
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS

      - name: Show uploaded VSIX checksum
        run: sha256sum artifacts/harness-lens.vsix

      - name: Publish the reviewed VSIX without rebuilding
        run: npm run publish:marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-npm:
    name: Publish npm package
    needs: assemble-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        run: npm run check
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}

      - name: Run tests
        run: npm test

      - name: Download reviewed release artifacts
        uses: actions/download-artifact@v8
        with:
          name: harness-lens-release
          path: artifacts/

      - name: Verify downloaded release artifacts
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS

      - name: Publish reviewed tarball with npm trusted publishing
        run: npm publish artifacts/harness-lens-vscode-*.tgz --access public
