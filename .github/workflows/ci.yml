name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and versions
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build npm package and VSIX
        run: npm run package

      - name: Upload package artifacts
        uses: actions/upload-artifact@v5
        with:
          name: harness-lens-packages
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
